name: Deploy to AWS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: true
env:
  AWS_REGION: us-east-1
  S3_BUCKET: portfolio-nhattien-prod-us
  CLOUDFRONT_DISTRIBUTION_ID: EYW9X6AKVNRII
jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881107655832:role/github-actions-static-site-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync build to S3
        run: aws s3 sync dist/ "s3://${{ env.S3_BUCKET }}" --delete
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"